<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Bill Tilghman</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <div>
      <h1>Bill Tilghman</h1>
      <p>Private AI Employee · Version 1</p>
    </div>
    <span class="status">● Online</span>
  </header>

  <main id="chat" aria-live="polite">
    <div class="message bill">
      <strong>Bill</strong>
      <div>Hello. I'm Bill Tilghman. I'm ready to work on opportunities to generate income while minimizing your time and resources. What's our next assignment?</div>
    </div>
  </main>

  <form id="composer">
    <textarea id="message" rows="2" placeholder="Message Bill…" autocomplete="off"></textarea>
    <button type="submit">Send</button>
  </form>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("composer");
const input = document.getElementById("message");

function addMessage(who, text, cls) {
  const el = document.createElement("div");
  el.className = "message " + cls;
  const strong = document.createElement("strong");
  strong.textContent = who;
  const body = document.createElement("div");
  body.textContent = text;
  el.appendChild(strong);
  el.appendChild(body);
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  input.value = "";
  addMessage("You", message, "user");
  addMessage("Bill", "Thinking…", "bill thinking");
  const thinking = chat.lastElementChild;

  try {
    const r = await fetch("/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message})
    });
    const data = await r.json();
    thinking.remove();
    if (!r.ok) throw new Error(data.error || "Request failed");
    addMessage("Bill", data.reply, "bill");
  } catch (err) {
    thinking.remove();
    addMessage("System", err.message, "system");
  }
});
</script>
</body>
</html>
